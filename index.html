<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Countdown bis Heiligabend</title>
  <meta name="description" content="Jeden Tag ein neuer Weihnachtsspruch – der Countdown bis Heiligabend 2026.">
  <meta name="theme-color" content="#ff8fc7">

  <!-- App-Icon -->
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-title" content="Weihnachten">

  <!-- Vorschau beim Teilen (WhatsApp, Signal, iMessage …) -->
  <!-- WICHTIG: DEIN-NAME und REPO-NAME unten durch deine echte Adresse ersetzen (2 Stellen) -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="de_DE">
  <meta property="og:title" content="Countdown bis Heiligabend 🎄">
  <meta property="og:description" content="Jeden Tag ein neuer Weihnachtsspruch – wie viele Tage sind es noch?">
  <meta property="og:url" content="https://DEIN-NAME.github.io/REPO-NAME/">
  <meta property="og:image" content="https://DEIN-NAME.github.io/REPO-NAME/icons/vorschau.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preload" href="fonts/rubik-black.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- SVG-Sticker im Y2K-Glanz-Look (einmal definiert, mehrfach verwendet) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="g-heart" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffc2e2"/><stop offset=".55" stop-color="#ff5fa8"/><stop offset="1" stop-color="#e5484d"/>
      </linearGradient>
      <linearGradient id="g-ginger" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#e4a877"/><stop offset="1" stop-color="#a8673a"/>
      </linearGradient>
      <radialGradient id="g-ball" cx=".35" cy=".3" r=".8">
        <stop offset="0" stop-color="#fff3c4"/><stop offset=".35" stop-color="#f4c95d"/><stop offset="1" stop-color="#c98a14"/>
      </radialGradient>
      <radialGradient id="g-ball2" cx=".35" cy=".3" r=".8">
        <stop offset="0" stop-color="#c9f3e1"/><stop offset=".4" stop-color="#5cc79c"/><stop offset="1" stop-color="#2f8f6b"/>
      </radialGradient>
    </defs>

    <symbol id="st-heart" viewBox="0 0 100 100">
      <path d="M50 90C20 67 4 50 4 31 4 15 16 4 30 4c9 0 16 5 20 12 4-7 11-12 20-12 14 0 26 11 26 27 0 19-16 36-46 59z" fill="url(#g-heart)" stroke="#fff" stroke-width="6" stroke-linejoin="round"/>
      <ellipse cx="30" cy="27" rx="13" ry="8" fill="#fff" opacity=".75" transform="rotate(-25 30 27)"/>
      <circle cx="74" cy="28" r="4" fill="#fff" opacity=".8"/>
    </symbol>

    <symbol id="st-cane" viewBox="0 0 100 100">
      <path d="M62 94V36a18 18 0 0 0-36 0" fill="none" stroke="#fff" stroke-width="24" stroke-linecap="round"/>
      <path d="M62 94V36a18 18 0 0 0-36 0" fill="none" stroke="#fff6fa" stroke-width="15" stroke-linecap="round"/>
      <path d="M62 94V36a18 18 0 0 0-36 0" fill="none" stroke="#e5484d" stroke-width="15" stroke-dasharray="8 9" stroke-linecap="butt"/>
      <path d="M57 90V38" stroke="#fff" stroke-width="3" opacity=".7" stroke-linecap="round"/>
    </symbol>

    <symbol id="st-ginger" viewBox="0 0 100 100">
      <path d="M50 4a14 14 0 0 1 9 25l18 6c8 3 8 14-1 15l-12 1 8 33c2 9-9 13-14 5l-8-14-8 14c-5 8-16 4-14-5l8-33-12-1c-9-1-9-12-1-15l18-6A14 14 0 0 1 50 4z" fill="url(#g-ginger)" stroke="#fff" stroke-width="5" stroke-linejoin="round"/>
      <circle cx="45" cy="16" r="2.5" fill="#4a2512"/><circle cx="55" cy="16" r="2.5" fill="#4a2512"/>
      <path d="M45 22q5 4 10 0" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="50" cy="40" r="3.5" fill="#ff5fa8"/><circle cx="50" cy="51" r="3.5" fill="#5cc79c"/><circle cx="50" cy="62" r="3.5" fill="#e5484d"/>
      <path d="M24 41q4 3 8 0M68 41q4 3 8 0M36 82q4 3 8 0M56 82q4 3 8 0" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
      <ellipse cx="44" cy="10" rx="6" ry="3" fill="#fff" opacity=".45" transform="rotate(-20 44 10)"/>
    </symbol>

    <symbol id="st-house" viewBox="0 0 100 100">
      <path d="M18 48h64v44H18z" fill="url(#g-ginger)" stroke="#fff" stroke-width="5" stroke-linejoin="round"/>
      <path d="M8 52L50 14l42 38" fill="#ff8fc7" stroke="#fff" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M14 50q6 6 12 0t12 0 12 0 12 0 12 0 12 0" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M42 92V72a8 8 0 0 1 16 0v20z" fill="#7a4220" stroke="#fff" stroke-width="3"/>
      <path d="M30 62c-4-4-1-8 2-6 3-2 6 2 2 6l-2 2z" fill="#e5484d"/>
      <path d="M68 62c-4-4-1-8 2-6 3-2 6 2 2 6l-2 2z" fill="#e5484d"/>
      <circle cx="26" cy="84" r="3" fill="#5cc79c"/><circle cx="74" cy="84" r="3" fill="#f4c95d"/>
      <path d="M66 22v-10h10v19" fill="#c68b59" stroke="#fff" stroke-width="3"/>
    </symbol>

    <symbol id="st-ball" viewBox="0 0 100 100">
      <rect x="42" y="6" width="16" height="12" rx="3" fill="#d9d9e3" stroke="#fff" stroke-width="3"/>
      <circle cx="50" cy="58" r="38" fill="url(#g-ball)" stroke="#fff" stroke-width="5"/>
      <path d="M14 56q36 14 72 0" fill="none" stroke="#e5484d" stroke-width="6"/>
      <ellipse cx="36" cy="40" rx="11" ry="7" fill="#fff" opacity=".75" transform="rotate(-30 36 40)"/>
    </symbol>

    <symbol id="st-ball2" viewBox="0 0 100 100">
      <rect x="42" y="6" width="16" height="12" rx="3" fill="#d9d9e3" stroke="#fff" stroke-width="3"/>
      <circle cx="50" cy="58" r="38" fill="url(#g-ball2)" stroke="#fff" stroke-width="5"/>
      <path d="M50 38l5 11 12 1-9 8 3 12-11-6-11 6 3-12-9-8 12-1z" fill="#fff" opacity=".9"/>
      <ellipse cx="34" cy="40" rx="10" ry="6" fill="#fff" opacity=".7" transform="rotate(-30 34 40)"/>
    </symbol>

    <symbol id="seal" viewBox="0 0 100 100">
      <path d="M50 4l9 7 11-2 5 10 11 4-1 11 7 9-7 9 1 11-11 4-5 10-11-2-9 7-9-7-11 2-5-10-11-4 1-11-7-9 7-9-1-11 11-4 5-10 11 2z" fill="#e5484d"/>
      <circle cx="50" cy="50" r="30" fill="#c8323a"/>
      <path d="M50 70C36 60 29 52 29 43c0-7 5-12 11-12 4 0 8 2 10 6 2-4 6-6 10-6 6 0 11 5 11 12 0 9-7 17-21 27z" fill="#ff8fc7"/>
      <ellipse cx="36" cy="30" rx="10" ry="5" fill="#fff" opacity=".35" transform="rotate(-30 36 30)"/>
    </symbol>
  </svg>

  <canvas id="schnee" aria-hidden="true"></canvas>
  <canvas id="konfetti" aria-hidden="true"></canvas>

  <div class="zuckerrand" aria-hidden="true"></div>

  <header class="laufband" aria-label="Laufband">
    <div class="laufband__spur"><span id="laufband-text"></span><span id="laufband-text-2" aria-hidden="true"></span></div>
  </header>

  <main class="buehne">
    <!-- Sticker -->
    <div class="sticker-feld" aria-hidden="true">
      <svg class="sticker s1"><use href="#st-heart"/></svg>
      <svg class="sticker s2"><use href="#st-cane"/></svg>
      <svg class="sticker s3"><use href="#st-ginger"/></svg>
      <svg class="sticker s4"><use href="#st-house"/></svg>
      <svg class="sticker s5"><use href="#st-ball"/></svg>
      <svg class="sticker s6"><use href="#st-heart"/></svg>
      <svg class="sticker s7"><use href="#st-ball2"/></svg>
      <svg class="sticker s8"><use href="#st-cane"/></svg>
    </div>

    <!-- Fenster im Retro-Desktop-Look -->
    <section class="fenster" aria-labelledby="fenster-titel">
      <div class="fenster__titel">
        <span class="fenster__icon" aria-hidden="true">🎄</span>
        <h1 id="fenster-titel">weihnachten.exe</h1>
        <span class="fenster__knoepfe" aria-hidden="true"><i>_</i><i>□</i><i class="x">×</i></span>
      </div>

      <div class="fenster__inhalt">
        <p class="vorzeile" id="vorzeile">Nur noch</p>
        <p class="zahl" id="zahl" aria-live="polite">35</p>
        <p class="unterzeile" id="unterzeile">Tage bis Heiligabend</p>

        <div class="lade">
          <p class="lade__text"><span id="lade-label">Weihnachten wird geladen …</span> <b id="lade-prozent">0&nbsp;%</b></p>
          <div class="lade__balken" role="progressbar" aria-labelledby="lade-label" aria-valuemin="0" aria-valuemax="100" id="lade-balken" aria-valuenow="0">
            <div class="lade__fuellung" id="lade-fuellung"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- Kitschiger Brief mit dem Spruch des Tages -->
    <section class="brief" aria-labelledby="brief-titel">
      <div class="brief__spitze">
        <svg class="brief__siegel" aria-hidden="true"><use href="#seal"/></svg>
      </div>
      <div class="brief__papier">
        <p class="brief__datum" id="brief-datum"></p>
        <h2 class="brief__titel" id="brief-titel">Dein Spruch für heute</h2>
        <blockquote class="brief__spruch">
          <p id="spruch"></p>
          <footer id="spruch-quelle" hidden></footer>
        </blockquote>
        <p class="brief__gruss">Herzlichst,<br><span>dein Weihnachts-Countdown</span> 💌</p>
      </div>
    </section>
  </main>

  <footer class="fuss">Mit Liebe gebacken 🍪</footer>

  <script src="sprueche.js"></script>
  <script src="script.js"></script>
</body>
</html>
